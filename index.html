<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F62B3">
<title>Outlook</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="drawer" aria-label="Pastas">
    <div class="rail">
      <div class="avwrap"><span class="av me big"></span><i class="dot"></i></div>
      <button class="plus" id="addAcc" aria-label="Adicionar conta" data-i="plus"></button>
      <span class="grow"></span>
      <button class="ib" id="helpBtn" aria-label="Ajuda" data-i="help"></button>
      <button class="ib gear" id="openSettings" aria-label="Configurações"><span data-i="gear"></span><i class="bd"></i></button>
    </div>
    <div class="panel">
      <div class="acc"><b>Outlook</b><small>felipegracianosouza@outlook.com</small></div>
      <div class="ph"><b>Pastas</b><button class="ib sm" id="editF" aria-label="Editar" data-i="pen"></button></div>
      <nav id="folders"></nav>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="top">
      <div class="hrow">
        <button class="avbtn" id="menuBtn" aria-label="Menu"><span class="av me"></span></button>
        <h1 id="title">Caixa de Entrada</h1>
        <input id="q" type="search" placeholder="Pesquisar" autocomplete="off">
        <span class="grow"></span>
        <button class="hi" id="bell" aria-label="Notificações" data-i="bell"></button>
        <button class="hi" id="todayBtn" aria-label="Hoje" data-i="grid" hidden></button>
        <button class="hi" id="sBtn" aria-label="Pesquisar" data-i="search"></button>
        <button class="hi" id="sClose" aria-label="Fechar pesquisa" data-i="close" hidden></button>
      </div>
      <div id="sub"><div class="seg"><button class="on" data-tab="focused">Destaques</button><button data-tab="other">Outros</button></div><button class="pill" id="filterBtn">Filtrar</button></div>
      <div id="wk" hidden><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
    </header>
    <div id="selbar" hidden>
      <button class="hi" id="selCancel" data-i="close" aria-label="Cancelar"></button><b id="selCount">0</b><span class="grow"></span>
      <button class="hi" data-bulk="read" data-i="mailopen" aria-label="Marcar como lido"></button>
      <button class="hi" data-bulk="archive" data-i="archive" aria-label="Arquivar"></button>
      <button class="hi" data-bulk="delete" data-i="trash" aria-label="Excluir"></button>
    </div>
    <div id="view-mail" class="view"><ul id="list"></ul></div>
    <div id="view-cal" class="view" hidden><div id="grid"></div></div>
    <button id="fab" aria-label="Novo"></button>
  </main>

  <nav id="bottom">
    <button class="on" data-nav="mail"><span data-i="mail"></span><small>Email</small></button>
    <button data-nav="cal"><span data-i="cal"></span><small>Calendário</small></button>
    <button data-nav="apps"><span data-i="apps"></span><small>Aplicativos</small></button>
  </nav>
  <div id="appscrim"></div>
  <div id="appsheet"><div class="grip"></div><button class="link" id="reord">Reordenar</button>
    <div class="tiles"><button data-app="Arquivos"><i data-i="file"></i><small>Arquivos</small></button><button data-app="Contatos"><i data-i="people"></i><small>Contatos</small></button><button data-app="Todos os aplicativos"><i class="blue" data-i="plusbox"></i><small>Todos os aplicativos</small></button></div></div>

  <section id="reader" aria-label="Leitura"></section>
  <section id="composer" aria-label="Novo e-mail">
    <div class="c-bar"><button class="ib" id="cClose" data-i="close" aria-label="Fechar"></button><span class="grow"></span>
      <button class="ib" id="cAttach" data-i="clip" aria-label="Anexar"></button><button class="ib" id="cDraft" data-i="save" aria-label="Salvar rascunho"></button><button class="ib send" id="cSend" data-i="send" aria-label="Enviar"></button></div>
    <div class="c-body">
      <label class="f"><span>Para</span><input id="cTo" type="email"><button class="link" id="ccToggle">Cc/Cco</button></label>
      <label class="f cc" hidden><span>Cc</span><input id="cCc"></label>
      <label class="f cc" hidden><span>Cco</span><input id="cBcc"></label>
      <label class="f"><span>Assunto</span><input id="cSub"></label>
      <div id="cAtts"></div>
      <textarea id="cText" placeholder="Escreva uma mensagem"></textarea>
    </div>
  </section>
  <section id="settings" class="page"></section>
  <section id="notif" class="page"></section>
  <div id="menu" hidden></div>
  <div id="sheet" hidden></div>
  <div id="toast" role="status"></div>
</div>
<script src="js/script.js"></script>
</body>
</html>
